<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>南あわじ市 体操会場マップ</title>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>南あわじ市 体操会場マップ</h1>
        <p>体操会場・徒歩圏・バス停</p>
      </div>
      <div class="status-pill" id="dataStatus">読み込み中</div>
    </header>

    <main class="app-shell">
      <aside class="control-panel" aria-label="操作パネル">
        <section class="panel-section">
          <h2>表示条件</h2>
          <label class="field-label" for="districtFilter">地区</label>
          <select id="districtFilter">
            <option value="all">すべての地区</option>
          </select>
        </section>

        <section class="panel-section">
          <h2>レイヤー</h2>
          <label class="check-row">
            <input type="checkbox" id="toggleVenues" checked>
            <span class="marker-dot venue-dot"></span>
            体操会場
          </label>
          <label class="check-row">
            <input type="checkbox" id="toggle300" checked>
            <span class="legend-line circle-300"></span>
            300m圏
          </label>
          <label class="check-row">
            <input type="checkbox" id="toggle600" checked>
            <span class="legend-line circle-600"></span>
            600m圏
          </label>
          <label class="check-row">
            <input type="checkbox" id="toggleBusStops" checked>
            <span class="marker-dot bus-dot"></span>
            バス停
          </label>
        </section>

        <section class="panel-section">
          <h2>背景地図</h2>
          <div class="segmented" role="group" aria-label="背景地図">
            <button type="button" class="map-mode is-active" data-basemap="standard">標準</button>
            <button type="button" class="map-mode" data-basemap="pale">淡色</button>
            <button type="button" class="map-mode" data-basemap="photo">写真</button>
          </div>
        </section>

        <section class="panel-section">
          <h2>凡例</h2>
          <ul class="legend-list">
            <li><span class="marker-dot venue-dot"></span>体操会場</li>
            <li><span class="legend-line circle-300"></span>徒歩5分圏（300m）</li>
            <li><span class="legend-line circle-600"></span>徒歩10分圏（600m）</li>
            <li><span class="marker-dot bus-dot"></span>バス停</li>
          </ul>
        </section>

        <section class="panel-section detail-section">
          <h2>選択会場</h2>
          <div id="venueDetail" class="detail-empty">
            会場を選択してください。
          </div>
        </section>
      </aside>

      <section class="map-panel" aria-label="地図">
        <div id="map"></div>
      </section>
    </main>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
